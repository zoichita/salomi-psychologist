<!doctype html>
<html lang="el"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="robots" content="noindex"><title>Επεξεργασία άρθρου | Εξέλιξη</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="../../assets/css/admin.css"></head>
<body class="admin-body" data-admin-page="editor"><main class="admin-shell" data-admin-app><a class="admin-brand" href="../dashboard/">← Επιστροφή στα άρθρα</a><section class="admin-editor"><h1 data-editor-title>Νέο άρθρο</h1><p>Το κείμενο δέχεται απλή μορφοποίηση, χωρίς να απαιτείται HTML.</p><form class="admin-form" data-editor-form><input name="type" type="hidden"><label>Τίτλος<input name="title" required></label><label>Slug<input name="slug" required pattern="[a-z0-9-]+" aria-describedby="slug-help"><small id="slug-help">Λατινικοί πεζοί χαρακτήρες, αριθμοί και παύλες.</small></label><label>Κατηγορία<input name="category" value="Προσωπική ανάπτυξη" required></label><label>Σύντομη περιγραφή<textarea name="excerpt" rows="3" required></textarea></label><div><label for="content">Κύριο κείμενο</label><div class="editor-tools" aria-label="Εργαλεία μορφοποίησης"><button type="button" data-markdown="heading">Τίτλος</button><button type="button" data-markdown="bold">Έντονα</button><button type="button" data-markdown="italic">Πλάγια</button><button type="button" data-markdown="link">Σύνδεσμος</button><button type="button" data-markdown="list">Λίστα</button><button type="button" data-markdown="quote">Παράθεμα</button></div><textarea id="content" name="content" required></textarea></div><label data-republished-only hidden>Αρχικός συγγραφέας<input name="original_author"></label><label data-republished-only hidden>Πηγή<input name="source_name"></label><label data-republished-only hidden>URL αρχικής πηγής<input name="source_url" type="url" placeholder="https://..."></label><label>Συγγραφέας<input name="author" value="Σαλώμη Τζιντζινόγλου"></label><label>Ημερομηνία<input name="published_at" type="date"></label><label>Εικόνα<input name="cover" type="file" accept="image/png,image/jpeg,image/webp"></label><img class="admin-image-preview" data-image-preview alt="Προεπισκόπηση εικόνας άρθρου"><div class="admin-editor__actions"><button class="admin-button admin-button--light" type="button" data-save-draft>Αποθήκευση ως πρόχειρο</button><button class="admin-button" type="button" data-publish>Δημοσίευση</button></div></form><p data-admin-notice class="admin-notice" aria-live="polite"></p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../../assets/js/supabase-config.js"></script><script src="../../assets/js/supabase-client.js"></script><script src="../../assets/js/admin.js"></script></body></html>
